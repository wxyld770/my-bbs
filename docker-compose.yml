services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: my_bbs
      MYSQL_ROOT_PASSWORD: change-me
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pchange-me"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis-persist:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - "0"
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - change-me
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "change-me", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-lru:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --maxmemory-samples
      - "10"
      - --requirepass
      - change-me
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "change-me", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      APP_MODE: release
      APP_PORT: "8080"
      LOG_DIR: logs
      DB_DSN: "root:change-me@tcp(db:3306)/my_bbs?charset=utf8mb4&parseTime=True&loc=Local"
      DB_AUTO_MIGRATE: "true"
      DB_MAX_OPEN_CONNS: "25"
      DB_MAX_IDLE_CONNS: "10"
      DB_CONN_MAX_LIFETIME: "30m"
      DB_CONN_MAX_IDLE_TIME: "5m"
      REDIS_PERSIST_ADDR: "redis-persist:6379"
      REDIS_PERSIST_PASS: "change-me"
      REDIS_LRU_ADDR: "redis-lru:6379"
      REDIS_LRU_PASS: "change-me"
      JWT_SECRET: "replace-this-before-any-public-deployment"
      ADMIN_USERNAMES: "${ADMIN_USERNAMES:?ADMIN_USERNAMES is required}"
      HTTP_READ_HEADER_TIMEOUT: "5s"
      HTTP_READ_TIMEOUT: "10s"
      HTTP_WRITE_TIMEOUT: "15s"
      HTTP_IDLE_TIMEOUT: "60s"
      HTTP_SHUTDOWN_TIMEOUT: "10s"
      HEALTH_CHECK_TIMEOUT: "2s"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis-persist:
        condition: service_healthy
      redis-lru:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
