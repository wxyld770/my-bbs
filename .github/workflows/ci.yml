name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload-backend.outputs.artifact-id }}
      ddl-artifact-id: ${{ steps.upload-ddl.outputs.artifact-id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.7
          cache-dependency-path: go.sum

      - name: Verify Go modules
        run: go mod verify

      - name: Run Go tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Validate repeatable MariaDB schema
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          ddl_file="scripts/full_ddl.sql"
          [[ -f "${ddl_file}" && ! -L "${ddl_file}" ]]
          ddl_size="$(stat -c '%s' "${ddl_file}")"
          [[ "${ddl_size}" =~ ^[0-9]+$ ]]
          (( ddl_size > 0 && ddl_size <= 1048576 ))

          python3 - "${ddl_file}" <<'PY'
          import pathlib
          import sys
          import unicodedata

          data = pathlib.Path(sys.argv[1]).read_bytes()
          if b"\x00" in data or b"\r" in data:
              raise SystemExit("full_ddl.sql contains NUL or CR bytes")
          text = data.decode("utf-8")
          if not text.strip():
              raise SystemExit("full_ddl.sql must contain non-whitespace SQL")
          if not data.endswith(b"\n"):
              raise SystemExit("full_ddl.sql must end with a newline")
          if text.startswith("\ufeff"):
              raise SystemExit("full_ddl.sql must not start with a UTF-8 BOM")
          for character in text:
              if character not in ("\n", "\t") and unicodedata.category(character) in ("Cc", "Cf", "Cs"):
                  raise SystemExit("full_ddl.sql contains a forbidden control character")
          PY

          [[ "${GITHUB_RUN_ID}" =~ ^[0-9]+$ ]]
          [[ "${GITHUB_RUN_ATTEMPT}" =~ ^[0-9]+$ ]]
          container="my-bbs-ddl-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          db_password="ddl-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup() {
            docker rm -f "${container}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT HUP INT TERM

          docker run --detach --name "${container}" \
            --env MYSQL_ROOT_PASSWORD="${db_password}" \
            --env MYSQL_DATABASE=my_bbs \
            mariadb:10.3.28 >/dev/null

          ready=false
          for _ in {1..60}; do
            if docker exec "${container}" \
              mysql \
                --user=root \
                --password="${db_password}" \
                --database=my_bbs \
                --batch \
                --skip-column-names \
                --execute='SELECT 1' >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          [[ "${ready}" == "true" ]]

          apply_ddl_raw() {
            docker exec --interactive "${container}" \
              mysql \
                --user=root \
                --password="${db_password}" \
                --database=my_bbs \
                --skip-force \
                --batch \
                --raw \
                --skip-column-names \
                --skip-reconnect \
                --binary-mode \
                --local-infile=0 \
              < "${ddl_file}"
          }

          apply_ddl() {
            local output
            output="$(apply_ddl_raw)"
            if [[ "${output}" != "FULL_DDL_OK" ]]; then
              printf 'full_ddl.sql returned an unexpected result: %q\n' "${output}" >&2
              return 1
            fi
          }

          assert_schema_contract() {
            local state
            state="$(docker exec "${container}" mysql \
              --user=root \
              --password="${db_password}" \
              --database=my_bbs \
              --batch \
              --raw \
              --skip-column-names \
              --execute='SELECT CONCAT(
                (SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA = "my_bbs" AND TABLE_NAME IN ("comments", "post_likes", "posts", "users", "invitations") AND TABLE_TYPE = "BASE TABLE"),
                ":",
                (SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = "my_bbs" AND TABLE_NAME = "users" AND COLUMN_NAME = "invite_code" AND LOWER(COLUMN_TYPE) = "char(6)" AND IS_NULLABLE = "YES" AND (COLUMN_DEFAULT IS NULL OR CAST(COLUMN_DEFAULT AS CHAR) = "NULL") AND COALESCE(EXTRA, "") = "" AND LOWER(CHARACTER_SET_NAME) = "utf8mb4" AND LOWER(COLLATION_NAME) = "utf8mb4_unicode_ci" AND COLUMN_COMMENT = "注册时使用的邀请码"),
                ":",
                (SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = "my_bbs" AND TABLE_NAME = "users" AND COLUMN_NAME = "avatar_url" AND LOWER(COLUMN_TYPE) = "varchar(2048)" AND IS_NULLABLE = "YES" AND (COLUMN_DEFAULT IS NULL OR CAST(COLUMN_DEFAULT AS CHAR) = "NULL") AND COALESCE(EXTRA, "") = "" AND LOWER(CHARACTER_SET_NAME) = "utf8mb4" AND LOWER(COLLATION_NAME) = "utf8mb4_bin" AND COLUMN_COMMENT = "头像图片链接"),
                ":",
                (SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = "my_bbs" AND TABLE_NAME = "users" AND COLUMN_NAME = "avatar_updated_at" AND LOWER(COLUMN_TYPE) = "datetime(3)" AND IS_NULLABLE = "YES" AND (COLUMN_DEFAULT IS NULL OR CAST(COLUMN_DEFAULT AS CHAR) = "NULL") AND COALESCE(EXTRA, "") = "" AND CHARACTER_SET_NAME IS NULL AND COLUMN_COMMENT = "头像最后修改时间"),
                ":",
                (SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA = "my_bbs" AND TABLE_NAME = "invitations" AND UPPER(ENGINE) = "INNODB" AND LOWER(TABLE_COLLATION) = "utf8mb4_unicode_ci"),
                ":",
                (SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = "my_bbs" AND TABLE_NAME = "invitations"),
                ":",
                (SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = "my_bbs" AND TABLE_NAME = "invitations" AND (
                  (COLUMN_NAME = "id" AND LOWER(COLUMN_TYPE) = "bigint(20) unsigned" AND IS_NULLABLE = "NO" AND (COLUMN_DEFAULT IS NULL OR CAST(COLUMN_DEFAULT AS CHAR) = "NULL") AND LOWER(EXTRA) = "auto_increment" AND CHARACTER_SET_NAME IS NULL AND COLUMN_COMMENT = "主键ID") OR
                  (COLUMN_NAME = "create_time" AND LOWER(COLUMN_TYPE) = "datetime(3)" AND IS_NULLABLE = "YES" AND (COLUMN_DEFAULT IS NULL OR CAST(COLUMN_DEFAULT AS CHAR) = "NULL") AND COALESCE(EXTRA, "") = "" AND CHARACTER_SET_NAME IS NULL AND COLUMN_COMMENT = "创建时间") OR
                  (COLUMN_NAME = "update_time" AND LOWER(COLUMN_TYPE) = "datetime(3)" AND IS_NULLABLE = "YES" AND (COLUMN_DEFAULT IS NULL OR CAST(COLUMN_DEFAULT AS CHAR) = "NULL") AND COALESCE(EXTRA, "") = "" AND CHARACTER_SET_NAME IS NULL AND COLUMN_COMMENT = "更新时间") OR
                  (COLUMN_NAME = "code" AND LOWER(COLUMN_TYPE) = "char(6)" AND IS_NULLABLE = "NO" AND (COLUMN_DEFAULT IS NULL OR CAST(COLUMN_DEFAULT AS CHAR) = "NULL") AND COALESCE(EXTRA, "") = "" AND LOWER(CHARACTER_SET_NAME) = "utf8mb4" AND LOWER(COLLATION_NAME) = "utf8mb4_unicode_ci" AND COLUMN_COMMENT = "邀请码") OR
                  (COLUMN_NAME = "creator_id" AND LOWER(COLUMN_TYPE) = "bigint(20) unsigned" AND IS_NULLABLE = "NO" AND (COLUMN_DEFAULT IS NULL OR CAST(COLUMN_DEFAULT AS CHAR) = "NULL") AND COALESCE(EXTRA, "") = "" AND CHARACTER_SET_NAME IS NULL AND COLUMN_COMMENT = "创建用户ID") OR
                  (COLUMN_NAME = "used_by" AND LOWER(COLUMN_TYPE) = "bigint(20) unsigned" AND IS_NULLABLE = "YES" AND (COLUMN_DEFAULT IS NULL OR CAST(COLUMN_DEFAULT AS CHAR) = "NULL") AND COALESCE(EXTRA, "") = "" AND CHARACTER_SET_NAME IS NULL AND COLUMN_COMMENT = "使用用户ID") OR
                  (COLUMN_NAME = "used_at" AND LOWER(COLUMN_TYPE) = "datetime(3)" AND IS_NULLABLE = "YES" AND (COLUMN_DEFAULT IS NULL OR CAST(COLUMN_DEFAULT AS CHAR) = "NULL") AND COALESCE(EXTRA, "") = "" AND CHARACTER_SET_NAME IS NULL AND COLUMN_COMMENT = "使用时间")
                )),
                ":",
                (SELECT COUNT(*) FROM information_schema.STATISTICS WHERE TABLE_SCHEMA = "my_bbs" AND SUB_PART IS NULL AND UPPER(INDEX_TYPE) = "BTREE" AND SEQ_IN_INDEX = 1 AND (
                  (TABLE_NAME = "users" AND INDEX_NAME = "idx_users_invite_code" AND NON_UNIQUE = 0 AND COLUMN_NAME = "invite_code") OR
                  (TABLE_NAME = "invitations" AND INDEX_NAME = "PRIMARY" AND NON_UNIQUE = 0 AND COLUMN_NAME = "id") OR
                  (TABLE_NAME = "invitations" AND INDEX_NAME = "idx_invitations_code" AND NON_UNIQUE = 0 AND COLUMN_NAME = "code") OR
                  (TABLE_NAME = "invitations" AND INDEX_NAME = "idx_invitations_creator_id" AND NON_UNIQUE = 1 AND COLUMN_NAME = "creator_id") OR
                  (TABLE_NAME = "invitations" AND INDEX_NAME = "idx_invitations_used_by" AND NON_UNIQUE = 0 AND COLUMN_NAME = "used_by")
                )),
                ":",
                (SELECT COUNT(*) FROM information_schema.STATISTICS WHERE TABLE_SCHEMA = "my_bbs" AND (
                  (TABLE_NAME = "users" AND INDEX_NAME = "idx_users_invite_code") OR
                  (TABLE_NAME = "invitations" AND INDEX_NAME IN ("PRIMARY", "idx_invitations_code", "idx_invitations_creator_id", "idx_invitations_used_by"))
                ))
              );')"
            if [[ "${state}" != "5:1:1:1:1:7:7:5:5" ]]; then
              printf 'unexpected schema contract state: %q\n' "${state}" >&2
              return 1
            fi
          }

          schema_snapshot() {
            docker exec "${container}" mysqldump \
              --user=root \
              --password="${db_password}" \
              --default-character-set=utf8mb4 \
              --no-data \
              --skip-comments \
              --skip-add-drop-table \
              --skip-lock-tables \
              my_bbs
          }

          production_data_snapshot() {
            docker exec "${container}" mysql \
              --user=root \
              --password="${db_password}" \
              --database=my_bbs \
              --batch \
              --raw \
              --skip-column-names \
              --execute='SELECT `table_name`, `id`, `payload`
              FROM (
                SELECT "users" AS `table_name`, `id`, CONCAT_WS("|",
                  COALESCE(DATE_FORMAT(`create_time`, "%Y-%m-%d %H:%i:%s.%f"), "<NULL>"),
                  COALESCE(DATE_FORMAT(`update_time`, "%Y-%m-%d %H:%i:%s.%f"), "<NULL>"),
                  COALESCE(DATE_FORMAT(`deleted`, "%Y-%m-%d %H:%i:%s.%f"), "<NULL>"),
                  HEX(`username`), HEX(`password`), COALESCE(HEX(`nickname`), "<NULL>"),
                  COALESCE(CAST(`status` AS CHAR), "<NULL>"), COALESCE(HEX(`introduction`), "<NULL>")
                ) AS `payload` FROM `users`
                UNION ALL
                SELECT "posts", `id`, CONCAT_WS("|",
                  COALESCE(DATE_FORMAT(`create_time`, "%Y-%m-%d %H:%i:%s.%f"), "<NULL>"),
                  COALESCE(DATE_FORMAT(`update_time`, "%Y-%m-%d %H:%i:%s.%f"), "<NULL>"),
                  COALESCE(DATE_FORMAT(`deleted`, "%Y-%m-%d %H:%i:%s.%f"), "<NULL>"),
                  CAST(`user_id` AS CHAR), HEX(`title`), HEX(`content`), CAST(`visible` AS CHAR),
                  COALESCE(DATE_FORMAT(`pinned_until`, "%Y-%m-%d %H:%i:%s.%f"), "<NULL>")
                ) FROM `posts`
                UNION ALL
                SELECT "comments", `id`, CONCAT_WS("|",
                  COALESCE(DATE_FORMAT(`create_time`, "%Y-%m-%d %H:%i:%s.%f"), "<NULL>"),
                  COALESCE(DATE_FORMAT(`update_time`, "%Y-%m-%d %H:%i:%s.%f"), "<NULL>"),
                  COALESCE(DATE_FORMAT(`deleted`, "%Y-%m-%d %H:%i:%s.%f"), "<NULL>"),
                  CAST(`post_id` AS CHAR), CAST(`user_id` AS CHAR), HEX(`content`)
                ) FROM `comments`
                UNION ALL
                SELECT "post_likes", `id`, CONCAT_WS("|",
                  COALESCE(DATE_FORMAT(`create_time`, "%Y-%m-%d %H:%i:%s.%f"), "<NULL>"),
                  COALESCE(DATE_FORMAT(`update_time`, "%Y-%m-%d %H:%i:%s.%f"), "<NULL>"),
                  CAST(`post_id` AS CHAR), CAST(`user_id` AS CHAR)
                ) FROM `post_likes`
              ) AS `production_rows`
              ORDER BY `table_name`, `id`;'
          }

          # A clean database and a fully provisioned database must both converge.
          apply_ddl
          assert_schema_contract
          schema_after_first="$(schema_snapshot)"
          apply_ddl
          assert_schema_contract
          schema_after_second="$(schema_snapshot)"
          [[ "${schema_after_first}" == "${schema_after_second}" ]]

          empty_rows="$(docker exec "${container}" mysql \
            --user=root \
            --password="${db_password}" \
            --database=my_bbs \
            --batch \
            --raw \
            --skip-column-names \
            --execute='SELECT
              (SELECT COUNT(*) FROM `users`) +
              (SELECT COUNT(*) FROM `posts`) +
              (SELECT COUNT(*) FROM `comments`) +
              (SELECT COUNT(*) FROM `post_likes`) +
              (SELECT COUNT(*) FROM `invitations`);')"
          [[ "${empty_rows}" == "0" ]]

          reset_database() {
            docker exec "${container}" mysql \
              --user=root \
              --password="${db_password}" \
              --batch \
              --execute='DROP DATABASE IF EXISTS `my_bbs`; CREATE DATABASE `my_bbs` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
          }

          load_production_baseline() {
            docker exec "${container}" mysql \
              --user=root \
              --password="${db_password}" \
              --database=my_bbs \
              --batch \
              --execute='
                CREATE TABLE `comments` (
                  `id` BIGINT(20) UNSIGNED NOT NULL AUTO_INCREMENT COMMENT "主键ID",
                  `create_time` DATETIME(3) DEFAULT NULL COMMENT "创建时间",
                  `update_time` DATETIME(3) DEFAULT NULL COMMENT "更新时间",
                  `deleted` DATETIME(3) DEFAULT NULL COMMENT "删除时间，空表示未删除",
                  `post_id` BIGINT(20) UNSIGNED NOT NULL,
                  `user_id` BIGINT(20) UNSIGNED NOT NULL,
                  `content` TEXT COLLATE utf8mb4_unicode_ci NOT NULL,
                  PRIMARY KEY (`id`),
                  KEY `idx_comments_deleted` (`deleted`),
                  KEY `idx_comments_post_id` (`post_id`),
                  KEY `idx_comments_user_id` (`user_id`)
                ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
                CREATE TABLE `post_likes` (
                  `id` BIGINT(20) UNSIGNED NOT NULL AUTO_INCREMENT COMMENT "主键ID",
                  `create_time` DATETIME(3) DEFAULT NULL COMMENT "创建时间",
                  `update_time` DATETIME(3) DEFAULT NULL COMMENT "更新时间",
                  `post_id` BIGINT(20) UNSIGNED NOT NULL,
                  `user_id` BIGINT(20) UNSIGNED NOT NULL,
                  PRIMARY KEY (`id`),
                  UNIQUE KEY `uk_like_user_post` (`post_id`, `user_id`)
                ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
                CREATE TABLE `posts` (
                  `id` BIGINT(20) UNSIGNED NOT NULL AUTO_INCREMENT COMMENT "主键ID",
                  `create_time` DATETIME(3) DEFAULT NULL COMMENT "创建时间",
                  `update_time` DATETIME(3) DEFAULT NULL COMMENT "更新时间",
                  `deleted` DATETIME(3) DEFAULT NULL COMMENT "删除时间，空表示未删除",
                  `user_id` BIGINT(20) UNSIGNED NOT NULL,
                  `title` VARCHAR(255) COLLATE utf8mb4_unicode_ci NOT NULL,
                  `content` TEXT COLLATE utf8mb4_unicode_ci NOT NULL,
                  `visible` TINYINT(4) NOT NULL COMMENT "可见性状态，1所有人可见，0仅自己可见",
                  `pinned_until` DATETIME(3) DEFAULT NULL COMMENT "置顶到期时间",
                  PRIMARY KEY (`id`),
                  KEY `idx_posts_deleted` (`deleted`),
                  KEY `idx_posts_user_id` (`user_id`),
                  KEY `idx_posts_pinned_until` (`pinned_until`)
                ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
                CREATE TABLE `users` (
                  `id` BIGINT(20) UNSIGNED NOT NULL AUTO_INCREMENT COMMENT "主键ID",
                  `create_time` DATETIME(3) DEFAULT NULL COMMENT "创建时间",
                  `update_time` DATETIME(3) DEFAULT NULL COMMENT "更新时间",
                  `deleted` DATETIME(3) DEFAULT NULL COMMENT "删除时间，空表示未删除",
                  `username` VARCHAR(64) COLLATE utf8mb4_unicode_ci NOT NULL COMMENT "用户名",
                  `password` VARCHAR(255) COLLATE utf8mb4_unicode_ci NOT NULL,
                  `nickname` VARCHAR(64) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT "用户昵称",
                  `status` TINYINT(4) DEFAULT 1 COMMENT "用户状态，1:正常，0禁言",
                  `introduction` VARCHAR(1024) COLLATE utf8mb4_unicode_ci DEFAULT NULL COMMENT "个人介绍",
                  PRIMARY KEY (`id`),
                  UNIQUE KEY `idx_users_username` (`username`),
                  KEY `idx_users_deleted` (`deleted`)
                ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
                INSERT INTO `users` (`id`, `create_time`, `username`, `password`, `nickname`, `status`, `introduction`)
                VALUES (101, "2026-01-02 03:04:05.123", "legacy-user", "legacy-password", "Legacy", 1, "existing row");
                INSERT INTO `posts` (`id`, `create_time`, `user_id`, `title`, `content`, `visible`, `pinned_until`)
                VALUES (201, "2026-01-03 03:04:05.123", 101, "legacy title", "legacy content", 1, "2026-09-01 00:00:00.000");
                INSERT INTO `comments` (`id`, `create_time`, `post_id`, `user_id`, `content`)
                VALUES (301, "2026-01-04 03:04:05.123", 201, 101, "legacy comment");
                INSERT INTO `post_likes` (`id`, `create_time`, `post_id`, `user_id`)
                VALUES (401, "2026-01-05 03:04:05.123", 201, 101);
              '
          }

          expect_ddl_failure() {
            if apply_ddl_raw; then
              echo "full_ddl.sql unexpectedly accepted an incompatible schema" >&2
              exit 1
            fi
          }

          # A missing UNIQUE index must still reject duplicate non-NULL values.
          reset_database
          apply_ddl
          docker exec "${container}" mysql \
            --user=root \
            --password="${db_password}" \
            --database=my_bbs \
            --batch \
            --execute='ALTER TABLE `users` DROP INDEX `idx_users_invite_code`; INSERT INTO `users` (`username`, `password`, `invite_code`) VALUES ("duplicate-a", "x", "ABC123"), ("duplicate-b", "y", "ABC123");'
          expect_ddl_failure

          duplicate_state="$(docker exec "${container}" mysql \
            --user=root \
            --password="${db_password}" \
            --database=my_bbs \
            --batch \
            --raw \
            --skip-column-names \
            --execute='SELECT CONCAT(
              (SELECT COUNT(*) FROM `users` WHERE `invite_code` = "ABC123"),
              ":",
              (SELECT COUNT(*) FROM information_schema.STATISTICS WHERE TABLE_SCHEMA = "my_bbs" AND TABLE_NAME = "users" AND INDEX_NAME = "idx_users_invite_code")
            );')"
          [[ "${duplicate_state}" == "2:0" ]]

          docker exec "${container}" mysql \
            --user=root \
            --password="${db_password}" \
            --database=my_bbs \
            --batch \
            --execute='UPDATE `users` SET `invite_code` = NULL WHERE `username` = "duplicate-b";'
          apply_ddl
          apply_ddl
          assert_schema_contract
          recovered_rows="$(docker exec "${container}" mysql \
            --user=root \
            --password="${db_password}" \
            --database=my_bbs \
            --batch \
            --raw \
            --skip-column-names \
            --execute='SELECT COUNT(*) FROM `users` WHERE `username` IN ("duplicate-a", "duplicate-b");')"
          [[ "${recovered_rows}" == "2" ]]

          # Upgrade the independently frozen current-production baseline. Future
          # additive DDL is appended to full_ddl.sql and is exercised here in order;
          # update this fixture only after that schema is already the production base.
          reset_database
          load_production_baseline
          production_before="$(production_data_snapshot)"
          apply_ddl
          assert_schema_contract
          apply_ddl
          assert_schema_contract
          production_after="$(production_data_snapshot)"
          [[ "${production_before}" == "${production_after}" ]]

          legacy_state="$(docker exec "${container}" mysql \
            --user=root \
            --password="${db_password}" \
            --database=my_bbs \
            --batch \
            --raw \
            --skip-column-names \
            --execute='SELECT CONCAT(
              (SELECT COUNT(*) FROM `users` WHERE `username` = "legacy-user" AND `invite_code` IS NULL),
              ":",
              (SELECT COUNT(*) FROM `users` WHERE `username` = "legacy-user" AND `avatar_url` IS NULL AND `avatar_updated_at` IS NULL),
              ":",
              (SELECT COUNT(*) FROM `invitations`)
            );')"
          [[ "${legacy_state}" == "1:1:0" ]]

      - name: Build production binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: >-
          go build -trimpath -buildvcs=true -ldflags="-s -w"
          -o "${RUNNER_TEMP}/my-bbs-linux-amd64" ./cmd

      - name: Upload backend component
        id: upload-backend
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/my-bbs-linux-amd64
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Upload database schema component
        id: upload-ddl
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: scripts/full_ddl.sql
          archive: false
          if-no-files-found: error
          retention-days: 1

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload-frontend.outputs.artifact-id }}
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend type checking
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Package frontend component
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          source_epoch="$(git show -s --format=%ct "${GITHUB_SHA}")"
          tar \
            --sort=name \
            --mtime="@${source_epoch}" \
            --owner=0 --group=0 --numeric-owner \
            --mode='u+rwX,go+rX,go-w' \
            -C dist -cf - . \
            | gzip -n -9 > "${RUNNER_TEMP}/my-bbs-frontend.tar.gz"

      - name: Upload frontend component
        id: upload-frontend
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/my-bbs-frontend.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs:
      - backend
      - frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    outputs:
      artifact-id: ${{ steps.upload-release.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload-release.outputs.artifact-digest }}

    steps:
      - name: Download backend component
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.backend.outputs.artifact-id }}
          path: ${{ runner.temp }}/components
          digest-mismatch: error

      - name: Download frontend component
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.frontend.outputs.artifact-id }}
          path: ${{ runner.temp }}/components
          digest-mismatch: error

      - name: Download database schema component
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.backend.outputs.ddl-artifact-id }}
          path: ${{ runner.temp }}/components
          digest-mismatch: error

      - name: Assemble immutable release
        shell: bash
        run: |
          set -euo pipefail
          umask 022

          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          release_dir="${RUNNER_TEMP}/my-bbs-release"
          bundle="${RUNNER_TEMP}/my-bbs-release-${GITHUB_SHA}.tar.gz"

          install -d -m 0755 "${release_dir}"
          install -m 0755 \
            "${RUNNER_TEMP}/components/my-bbs-linux-amd64" \
            "${release_dir}/my-bbs-linux-amd64"
          install -m 0644 \
            "${RUNNER_TEMP}/components/my-bbs-frontend.tar.gz" \
            "${release_dir}/my-bbs-frontend.tar.gz"
          install -m 0644 \
            "${RUNNER_TEMP}/components/full_ddl.sql" \
            "${release_dir}/my-bbs-full-ddl.sql"

          ddl_sha256="$(sha256sum "${release_dir}/my-bbs-full-ddl.sql" | awk '{print $1}')"
          [[ "${ddl_sha256}" =~ ^[0-9a-f]{64}$ ]]

          jq -n \
            --arg commit_sha "${GITHUB_SHA}" \
            --arg source_ref "${GITHUB_REF}" \
            --arg ddl_sha256 "${ddl_sha256}" \
            '{
              schema_version: 2,
              application: "my-bbs",
              commit_sha: $commit_sha,
              source_ref: $source_ref,
              target_os: "linux",
              target_arch: "amd64",
              go_version: "go1.26.7",
              node_version: "v24.19.0",
              database: {
                engine: "mariadb",
                ddl_file: "my-bbs-full-ddl.sql",
                ddl_sha256: $ddl_sha256
              }
            }' > "${release_dir}/release.json"

          (
            cd "${release_dir}"
            sha256sum \
              my-bbs-linux-amd64 \
              my-bbs-frontend.tar.gz \
              my-bbs-full-ddl.sql \
              release.json \
              > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

          tar \
            --sort=name \
            --mtime='@0' \
            --owner=0 --group=0 --numeric-owner \
            --mode='u+rwX,go+rX,go-w' \
            -C "${release_dir}" \
            -cf - \
            my-bbs-linux-amd64 \
            my-bbs-frontend.tar.gz \
            my-bbs-full-ddl.sql \
            release.json \
            SHA256SUMS \
            | gzip -n -9 > "${bundle}"

          members_file="${RUNNER_TEMP}/release-members.txt"
          tar -tzf "${bundle}" > "${members_file}"
          mapfile -t members < "${members_file}"
          expected=(
            my-bbs-linux-amd64
            my-bbs-frontend.tar.gz
            my-bbs-full-ddl.sql
            release.json
            SHA256SUMS
          )
          [[ "${members[*]}" == "${expected[*]}" ]]

      - name: Upload immutable release artifact
        id: upload-release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ runner.temp }}/my-bbs-release-${{ github.sha }}.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Write release summary
        env:
          ARTIFACT_ID: ${{ steps.upload-release.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload-release.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload-release.outputs.artifact-url }}
        run: |
          {
            echo "## Release artifact"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Artifact ID: \`${ARTIFACT_ID}\`"
            echo "- Digest: \`${ARTIFACT_DIGEST}\`"
            echo "- Download: ${ARTIFACT_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"

  deploy:
    name: Deploy production
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
      - package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    environment:
      name: production
      url: ${{ vars.PROD_SITE_URL }}
    concurrency:
      group: my-bbs-production
      cancel-in-progress: false

    steps:
      - name: Download immutable release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: ${{ runner.temp }}/production-release
          digest-mismatch: error

      - name: Validate release artifact and main head
        id: deployment-context
        shell: bash
        env:
          ARTIFACT_DIGEST: ${{ needs.package.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          umask 077

          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${GITHUB_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]

          bundle="${RUNNER_TEMP}/production-release/my-bbs-release-${GITHUB_SHA}.tar.gz"
          [[ -f "${bundle}" && ! -L "${bundle}" ]]

          expected_digest="${ARTIFACT_DIGEST}"
          [[ "${expected_digest}" =~ ^[0-9a-f]{64}$ ]]

          shopt -s nullglob dotglob
          downloaded_files=("${RUNNER_TEMP}/production-release"/*)
          [[ "${#downloaded_files[@]}" -eq 1 ]]
          [[ "${downloaded_files[0]}" == "${bundle}" ]]

          bundle_size="$(stat -c '%s' "${bundle}")"
          [[ "${bundle_size}" =~ ^[0-9]+$ ]]
          (( bundle_size > 0 && bundle_size <= 100663296 ))

          actual_digest="$(sha256sum "${bundle}" | awk '{print $1}')"
          [[ "${actual_digest}" == "${expected_digest}" ]]

          main_head="$(
            git ls-remote --exit-code \
              "https://github.com/${GITHUB_REPOSITORY}.git" \
              refs/heads/main \
              | awk 'NR == 1 {print $1}'
          )"
          [[ "${main_head}" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${main_head}" != "${GITHUB_SHA}" ]]; then
            echo "Refusing to deploy stale commit ${GITHUB_SHA}; main is ${main_head}." >&2
            exit 78
          fi

          printf 'bundle-sha256=%s\n' "${expected_digest}" >> "${GITHUB_OUTPUT}"

      - name: Prepare pinned SSH identity
        shell: bash
        env:
          PROD_SSH_HOST: ${{ vars.PROD_SSH_HOST }}
          PROD_SSH_PORT: ${{ vars.PROD_SSH_PORT }}
          PROD_SSH_USER: ${{ vars.PROD_SSH_USER }}
          PROD_SSH_KNOWN_HOSTS: ${{ vars.PROD_SSH_KNOWN_HOSTS }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077

          [[ "${PROD_SSH_HOST}" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "${PROD_SSH_HOST}" != -* ]]
          [[ "${PROD_SSH_PORT}" == "22" ]]
          [[ "${PROD_SSH_USER}" == "deploy" ]]
          [[ -n "${PROD_SSH_PRIVATE_KEY}" ]]
          [[ -n "${PROD_SSH_KNOWN_HOSTS}" ]]

          ssh_dir="${RUNNER_TEMP}/my-bbs-ssh"
          private_key="${ssh_dir}/id_ed25519"
          public_key="${ssh_dir}/id_ed25519.pub"
          known_hosts="${ssh_dir}/known_hosts"

          install -d -m 0700 "${ssh_dir}"
          printf '%s\n' "${PROD_SSH_PRIVATE_KEY}" > "${private_key}"
          chmod 0600 "${private_key}"
          ssh-keygen -y -P '' -f "${private_key}" > "${public_key}"

          deploy_key_fingerprint="$(ssh-keygen -lf "${public_key}" -E sha256 | awk '{print $2}')"
          [[ "${deploy_key_fingerprint}" == "SHA256:1MbAINQJQEQUqCwDajnEFhRCPpI7QSj18NT8VkQS5qI" ]]

          printf '%s\n' "${PROD_SSH_KNOWN_HOSTS}" > "${known_hosts}"
          chmod 0600 "${known_hosts}"

          read -r known_host known_type known_key known_extra < "${known_hosts}"
          [[ "${known_host}" == "${PROD_SSH_HOST}" ]]
          [[ "${known_type}" == "ssh-ed25519" ]]
          [[ -n "${known_key}" && -z "${known_extra:-}" ]]
          [[ "$(wc -l < "${known_hosts}")" -eq 1 ]]
          ssh-keygen -F "${PROD_SSH_HOST}" -f "${known_hosts}" >/dev/null

          host_key_fingerprint="$(ssh-keygen -lf "${known_hosts}" -E sha256 | awk 'NR == 1 {print $2}')"
          [[ "${host_key_fingerprint}" == "SHA256:QNC5ZaYfXItgvd93c+7sio/D5gmkiTjDfml04OekH3E" ]]

      - name: Upload and activate release
        shell: bash
        env:
          BUNDLE_SHA256: ${{ steps.deployment-context.outputs.bundle-sha256 }}
          PROD_SSH_HOST: ${{ vars.PROD_SSH_HOST }}
          PROD_SSH_PORT: ${{ vars.PROD_SSH_PORT }}
          PROD_SSH_USER: ${{ vars.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          umask 077

          bundle="${RUNNER_TEMP}/production-release/my-bbs-release-${GITHUB_SHA}.tar.gz"
          private_key="${RUNNER_TEMP}/my-bbs-ssh/id_ed25519"
          known_hosts="${RUNNER_TEMP}/my-bbs-ssh/known_hosts"
          remote="${PROD_SSH_USER}@${PROD_SSH_HOST}"
          remote_dir="/var/lib/my-bbs-deploy/incoming/${GITHUB_SHA}"
          remote_temp="${remote_dir}/.my-bbs-release.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.tmp"

          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${BUNDLE_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${GITHUB_RUN_ID}" =~ ^[0-9]+$ ]]
          [[ "${GITHUB_RUN_ATTEMPT}" =~ ^[0-9]+$ ]]
          [[ "${PROD_SSH_HOST}" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "${PROD_SSH_HOST}" != -* ]]
          [[ "${PROD_SSH_PORT}" == "22" ]]
          [[ "${PROD_SSH_USER}" == "deploy" ]]
          [[ -f "${bundle}" && ! -L "${bundle}" ]]
          [[ -f "${private_key}" && ! -L "${private_key}" ]]
          [[ -f "${known_hosts}" && ! -L "${known_hosts}" ]]

          ssh_options=(
            -i "${private_key}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="${known_hosts}"
            -o GlobalKnownHostsFile=/dev/null
            -o HostKeyAlgorithms=ssh-ed25519
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o PreferredAuthentications=publickey
            -o ClearAllForwardings=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=3
            -o LogLevel=ERROR
          )

          ssh "${ssh_options[@]}" -p "${PROD_SSH_PORT}" "${remote}" \
            bash -s -- "${GITHUB_SHA}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" <<'PREPARE_REMOTE'
          set -euo pipefail
          umask 077

          commit_sha="$1"
          run_id="$2"
          run_attempt="$3"

          [[ "${commit_sha}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${run_id}" =~ ^[0-9]+$ ]]
          [[ "${run_attempt}" =~ ^[0-9]+$ ]]
          [[ "$(id -un)" == "deploy" ]]

          incoming_root=/var/lib/my-bbs-deploy/incoming
          remote_dir="${incoming_root}/${commit_sha}"
          remote_temp="${remote_dir}/.my-bbs-release.${run_id}.${run_attempt}.tmp"

          [[ -d "${incoming_root}" && ! -L "${incoming_root}" ]]
          if [[ -e "${remote_dir}" ]]; then
            [[ -d "${remote_dir}" && ! -L "${remote_dir}" ]]
          else
            install -d -m 0700 "${remote_dir}"
          fi
          [[ ! -e "${remote_temp}" ]]
          PREPARE_REMOTE

          scp "${ssh_options[@]}" -P "${PROD_SSH_PORT}" -- \
            "${bundle}" "${remote}:${remote_temp}"

          ssh "${ssh_options[@]}" -p "${PROD_SSH_PORT}" "${remote}" \
            bash -s -- \
              "${GITHUB_SHA}" \
              "${BUNDLE_SHA256}" \
              "${GITHUB_RUN_ID}" \
              "${GITHUB_RUN_ATTEMPT}" <<'ACTIVATE_REMOTE'
          set -euo pipefail
          umask 077

          commit_sha="$1"
          expected_digest="$2"
          run_id="$3"
          run_attempt="$4"

          [[ "${commit_sha}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${expected_digest}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${run_id}" =~ ^[0-9]+$ ]]
          [[ "${run_attempt}" =~ ^[0-9]+$ ]]
          [[ "$(id -un)" == "deploy" ]]

          incoming_root=/var/lib/my-bbs-deploy/incoming
          remote_dir="${incoming_root}/${commit_sha}"
          remote_temp="${remote_dir}/.my-bbs-release.${run_id}.${run_attempt}.tmp"
          remote_bundle="${remote_dir}/my-bbs-release.tar.gz"

          cleanup_temp() {
            if [[ -f "${remote_temp}" && ! -L "${remote_temp}" ]]; then
              rm -f -- "${remote_temp}"
            fi
          }
          trap cleanup_temp EXIT HUP INT TERM

          [[ -d "${incoming_root}" && ! -L "${incoming_root}" ]]
          [[ -d "${remote_dir}" && ! -L "${remote_dir}" ]]
          [[ -f "${remote_temp}" && ! -L "${remote_temp}" ]]

          actual_digest="$(sha256sum "${remote_temp}" | awk '{print $1}')"
          [[ "${actual_digest}" == "${expected_digest}" ]]
          chmod 0600 "${remote_temp}"

          if [[ -e "${remote_bundle}" ]]; then
            [[ -f "${remote_bundle}" && ! -L "${remote_bundle}" ]]
            existing_digest="$(sha256sum "${remote_bundle}" | awk '{print $1}')"
            [[ "${existing_digest}" == "${expected_digest}" ]]
            cleanup_temp
          else
            mv -T -- "${remote_temp}" "${remote_bundle}"
          fi

          published_digest="$(sha256sum "${remote_bundle}" | awk '{print $1}')"
          [[ "${published_digest}" == "${expected_digest}" ]]

          trap - EXIT HUP INT TERM
          /usr/bin/sudo -n -- /usr/local/sbin/deploy-my-bbs \
            "${commit_sha}" "${expected_digest}"
          ACTIVATE_REMOTE

      - name: Remove SSH key material
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f -- \
            "${RUNNER_TEMP}/my-bbs-ssh/id_ed25519" \
            "${RUNNER_TEMP}/my-bbs-ssh/id_ed25519.pub" \
            "${RUNNER_TEMP}/my-bbs-ssh/known_hosts"
          rmdir "${RUNNER_TEMP}/my-bbs-ssh" 2>/dev/null || true

      - name: Verify public production endpoints
        shell: bash
        env:
          PROD_SITE_URL: ${{ vars.PROD_SITE_URL }}
        run: |
          set -euo pipefail

          site_url="${PROD_SITE_URL%/}"
          [[ "${site_url}" == "https://5iyeji.xyz" ]]

          request_status() {
            curl \
              --proto '=https' \
              --tlsv1.2 \
              --connect-timeout 10 \
              --max-time 20 \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              "$1"
          }

          [[ "$(request_status "${site_url}/")" == "200" ]]
          [[ "$(request_status "${site_url}/livez")" == "200" ]]
          [[ "$(request_status "${site_url}/readyz")" == "404" ]]
          [[ "$(request_status "${site_url}/api/posts?pageNo=1&pageSize=1")" == "200" ]]

      - name: Write deployment summary
        if: ${{ success() }}
        env:
          BUNDLE_SHA256: ${{ steps.deployment-context.outputs.bundle-sha256 }}
          PROD_SITE_URL: ${{ vars.PROD_SITE_URL }}
        run: |
          {
            echo "## Production deployment"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Bundle SHA-256: \`${BUNDLE_SHA256}\`"
            echo "- Site: ${PROD_SITE_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"
